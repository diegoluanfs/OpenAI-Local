name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Run Ruff
        run: ruff check app tests

      - name: Run mypy
        run: mypy app tests --ignore-missing-imports --no-error-summary

      - name: Run tests
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Validate OpenAPI contract
        run: |
          python - <<'PY'
          from app.main import app

          schema = app.openapi()
          required_paths = {
              "/ask",
              "/v1/chat/completions",
              "/v1/completions",
              "/v1/embeddings",
              "/health",
              "/health/live",
              "/health/ready",
          }
          missing_paths = required_paths.difference(schema["paths"])
          if missing_paths:
              raise SystemExit(f"Missing OpenAPI paths: {sorted(missing_paths)}")
          print(f"OpenAPI validated: {len(schema['paths'])} paths")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        shell: bash
        run: |
          mkdir -p deploy/secrets
          printf 'ci-validation-key\n' > deploy/secrets/allowed_api_keys
          cp deploy/.env.production.example deploy/.env.production
          IMAGE_TAG=ci IMAGE_REPOSITORY=local-llm-server \
            docker compose --env-file deploy/.env.production \
            -f deploy/docker-compose.production.yml config --quiet
          docker compose --profile tracing config --quiet

      - name: Validate deployment scripts
        shell: bash
        run: |
          sh -n deploy/scripts/staging-deploy.sh
          sh -n deploy/scripts/staging-rollback.sh

      - name: Build Docker image
        run: docker build --tag local-llm-server:ci .

      - name: Smoke test Docker image
        run: |
          docker run --detach --name local-llm-server-ci --publish 8000:8000 local-llm-server:ci
          trap 'docker rm --force local-llm-server-ci' EXIT
          for attempt in {1..20}; do
            if docker run --rm --network host python:3.12-slim python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"; then
              exit 0
            fi
            sleep 2
          done
          docker logs local-llm-server-ci
          exit 1
