name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag already validated in staging
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_REPOSITORY: ghcr.io/diegoluanfs/openai-local
      DEPLOY_ENV: production
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Trust production host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" "mkdir -p '$DEPLOY_PATH/scripts' '$DEPLOY_PATH/secrets'"

      - name: Upload deployment files
        run: |
          scp deploy/docker-compose.production.yml deploy/Caddyfile \
            deploy/scripts/staging-deploy.sh deploy/scripts/staging-rollback.sh deploy/scripts/validate-secrets.sh \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$DEPLOY_PATH/"
          scp deploy/scripts/staging-deploy.sh deploy/scripts/staging-rollback.sh deploy/scripts/validate-secrets.sh \
            "$PRODUCTION_USER@$PRODUCTION_HOST:$DEPLOY_PATH/scripts/"

      - name: Deploy and smoke test
        id: deploy
        continue-on-error: true
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_REPOSITORY='$IMAGE_REPOSITORY' DEPLOY_ENV='$DEPLOY_ENV' DEPLOY_PATH='$DEPLOY_PATH' \
            sh '$DEPLOY_PATH/scripts/staging-deploy.sh'"

      - name: Collect production logs
        if: always()
        run: |
          ssh "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$DEPLOY_PATH' && docker compose --env-file .env.production \
            -f docker-compose.production.yml logs --no-color --tail=200" > production-deploy.log 2>&1 || true

      - name: Upload production logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-logs-${{ github.run_id }}
          path: production-deploy.log

      - name: Fail if deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
