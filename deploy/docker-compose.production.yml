services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  local-llm-server:
    image: ${IMAGE_REPOSITORY:-ghcr.io/diegoluanfs/openai-local}:${IMAGE_TAG:?IMAGE_TAG must be set}
    env_file:
      - ./.env.production
    environment:
      ALLOWED_API_KEYS_FILE: /run/secrets/allowed_api_keys
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    secrets:
      - allowed_api_keys
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - ./.env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      local-llm-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  allowed_api_keys:
    file: ./secrets/allowed_api_keys
