name: Validate production

on:
  workflow_dispatch:
    inputs:
      run_inference_benchmark:
        description: Run the real chat benchmark against the configured production model
        required: true
        default: false
        type: boolean
      model:
        description: Model used by the optional inference benchmark
        required: false
        default: llama3.2:3b
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      MODEL: ${{ inputs.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: python -m pip install httpx==0.28.1

      - name: Validate required configuration
        run: |
          test -n "$BASE_URL"
          test -n "$API_KEY"

      - name: Validate liveness and readiness
        run: |
          curl --fail --silent --show-error "$BASE_URL/health/live"
          curl --fail --silent --show-error "$BASE_URL/health/ready"

      - name: Validate authenticated models endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $API_KEY" "$BASE_URL/v1/models"

      - name: Benchmark health endpoint
        run: |
          python scripts/benchmark.py \
            --base-url "$BASE_URL" \
            --path /health/live \
            --requests 100 \
            --concurrency 10 \
            --warmup 5 \
            --output production-health-benchmark.json

      - name: Benchmark inference endpoint
        if: inputs.run_inference_benchmark
        run: |
          python scripts/benchmark.py \
            --base-url "$BASE_URL" \
            --path /v1/chat/completions \
            --model "$MODEL" \
            --requests 20 \
            --concurrency 2 \
            --warmup 2 \
            --stream \
            --sample-memory \
            --api-key "$API_KEY" \
            --output production-inference-benchmark.json

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-validation-${{ github.run_id }}
          path: "*-benchmark.json"
